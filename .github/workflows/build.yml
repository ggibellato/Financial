name: Financial build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

# pull-requests: write lets the coverage-comment job post one combined sticky PR comment for
# backend/wpf/web; contents: read is needed alongside it because declaring `permissions:` at all
# replaces the GITHUB_TOKEN's default grants with exactly this set.
permissions:
  contents: read
  pull-requests: write

# On pull requests `changes` maps the diff onto the jobs below (rules live in
# .github/scripts/detect-changes.sh); skipped jobs report "skipped" and `ci-status` is the single
# required check that fails only when a job that actually ran failed. Every push to main runs the
# full pipeline regardless of what changed: main must always be deployable.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      wpf: ${{ steps.detect.outputs.wpf }}
      web: ${{ steps.detect.outputs.web }}
      smoke: ${{ steps.detect.outputs.smoke }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Detect affected jobs
      id: detect
      env:
        FULL_RUN: ${{ github.event_name == 'push' }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        if [ -n "$BASE_SHA" ] && ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
          git fetch --no-tags origin "$BASE_SHA" || true
        fi
        merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "$BASE_SHA")
        bash .github/scripts/detect-changes.sh "$merge_base" "$HEAD_SHA"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: windows-latest
    outputs:
      coverage: ${{ steps.gate.outputs.coverage }}
      band: ${{ steps.gate.outputs.band }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build --configuration Release

    # Every test project in the solution except the WPF one, which the `wpf` job owns.
    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal --filter "FullyQualifiedName!~Financial.Presentation.Tests" --settings coverlet.runsettings --results-directory TestResults

    # coverlet.runsettings declares the XPlat collector itself, so --settings is enough to turn
    # collection on - no --collect argument, and so no "XPlat Code Coverage" quoting to get wrong
    # on the PowerShell-hosted Windows runner. The file is the single source of truth for what is
    # excluded (generated obj/** code).
    # Financial.Architecture.Tests project-references Financial.App (to check its dependency
    # rules), which pulls Financial.Presentation.App into this job's test process - coverlet
    # then instruments it here too, at whatever near-zero % incidental reflection leaves it at,
    # even though nothing in this job behaviorally exercises it. Its real coverage is measured
    # by the wpf job below, from Financial.Presentation.Tests; filtering it out of backend's own
    # report (not its collection - coverlet.runsettings is unchanged) is what keeps this number
    # honest as "backend" coverage instead of misattributing an untested-here WPF assembly to it.
    - name: Publish coverage summary
      run: |
        dotnet tool install dotnet-reportgenerator-globaltool --tool-path .tools
        ./.tools/reportgenerator.exe "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:CoverageReport" "-reporttypes:MarkdownSummaryGithub;JsonSummary;Html" "-assemblyfilters:+*;-Financial.Presentation.App"
        Get-Content CoverageReport/SummaryGithub.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

    # Graded, non-blocking signal: green (100%) / yellow (95-99.99%) / amber (90-94.99%) /
    # red (<90%, step fails). continue-on-error keeps a red result from failing the job, so
    # ci-status/branch protection are unaffected - see docs/ci-affected-pipeline.md. coverage/band
    # are also written as job outputs for the coverage-comment job's combined PR comment table.
    - name: Check coverage threshold
      id: gate
      continue-on-error: true
      shell: pwsh
      run: |
        $summary = Get-Content CoverageReport/Summary.json -Raw | ConvertFrom-Json
        $lineCoverage = $summary.summary.linecoverage
        if ($null -eq $lineCoverage) {
          Write-Host "::error::Could not read summary.linecoverage from CoverageReport/Summary.json"
          "🔴 Coverage gate: could not read line coverage from the report" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit 1
        }
        $lineCoverage = [math]::Round([double]$lineCoverage, 2)
        if ($lineCoverage -ge 100) { $band = 'green'; $emoji = '🟢' }
        elseif ($lineCoverage -ge 95) { $band = 'yellow'; $emoji = '🟡' }
        elseif ($lineCoverage -ge 90) { $band = 'amber'; $emoji = '🟠' }
        else { $band = 'red'; $emoji = '🔴' }
        "$emoji Backend line coverage: $lineCoverage% ($band) - gate: 90% required" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
        "coverage=$lineCoverage" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
        "band=$band" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
        if ($band -eq 'red') {
          Write-Host "::error::Backend line coverage $lineCoverage% is below the 90% gate"
          exit 1
        } elseif ($band -ne 'green') {
          Write-Host "::warning::Backend line coverage $lineCoverage% ($band)"
        }

    - name: Upload coverage report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-backend
        path: CoverageReport

  wpf:
    needs: changes
    if: needs.changes.outputs.wpf == 'true'
    runs-on: windows-latest
    outputs:
      coverage: ${{ steps.gate.outputs.coverage }}
      band: ${{ steps.gate.outputs.band }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Build WPF app
      run: dotnet build Financial.App/Financial.App.csproj --configuration Release

    - name: Run tests
      run: |
        dotnet test Tests/Financial.Presentation.Tests --configuration Release --verbosity normal --settings coverlet.runsettings --results-directory TestResults
        dotnet test Tests/Financial.Architecture.Tests --configuration Release --verbosity normal

    # Only Financial.Presentation.Tests collects coverage above (Architecture.Tests doesn't pass
    # --settings). Financial.Presentation.Tests loads its dependencies' assemblies too (backend
    # projects Financial.App composes), so this filters the report down to Financial.Presentation.App
    # itself - the counterpart to backend's, which deliberately excludes this same assembly to
    # avoid double-attributing it.
    - name: Publish coverage summary
      run: |
        dotnet tool install dotnet-reportgenerator-globaltool --tool-path .tools
        ./.tools/reportgenerator.exe "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:CoverageReport" "-reporttypes:MarkdownSummaryGithub;JsonSummary;Html" "-assemblyfilters:+Financial.Presentation.App"
        Get-Content CoverageReport/SummaryGithub.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

    # Graded, non-blocking signal: green (100%) / yellow (95-99.99%) / amber (90-94.99%) /
    # red (<90%, step fails). continue-on-error keeps a red result from failing the job, so
    # ci-status/branch protection are unaffected - see docs/ci-affected-pipeline.md. coverage/band
    # are also written as job outputs for the coverage-comment job's combined PR comment table.
    - name: Check coverage threshold
      id: gate
      continue-on-error: true
      shell: pwsh
      run: |
        $summary = Get-Content CoverageReport/Summary.json -Raw | ConvertFrom-Json
        $lineCoverage = $summary.summary.linecoverage
        if ($null -eq $lineCoverage) {
          Write-Host "::error::Could not read summary.linecoverage from CoverageReport/Summary.json"
          "🔴 Coverage gate: could not read line coverage from the report" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit 1
        }
        $lineCoverage = [math]::Round([double]$lineCoverage, 2)
        if ($lineCoverage -ge 100) { $band = 'green'; $emoji = '🟢' }
        elseif ($lineCoverage -ge 95) { $band = 'yellow'; $emoji = '🟡' }
        elseif ($lineCoverage -ge 90) { $band = 'amber'; $emoji = '🟠' }
        else { $band = 'red'; $emoji = '🔴' }
        "$emoji WPF line coverage: $lineCoverage% ($band) - gate: 90% required" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
        "coverage=$lineCoverage" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
        "band=$band" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
        if ($band -eq 'red') {
          Write-Host "::error::WPF line coverage $lineCoverage% is below the 90% gate"
          exit 1
        } elseif ($band -ne 'green') {
          Write-Host "::warning::WPF line coverage $lineCoverage% ($band)"
        }

    - name: Upload coverage report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-wpf
        path: CoverageReport

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.gate.outputs.coverage }}
      band: ${{ steps.gate.outputs.band }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24.13.0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      working-directory: Financial.Web
      run: npm install

    - name: Lint
      working-directory: Financial.Web
      run: npm run lint

    - name: Run tests
      working-directory: Financial.Web
      run: npm run test:coverage

    # Mirrors backend/wpf's own "Publish coverage summary" step: reportgenerator reads the lcov
    # report vitest's coverage.reporter also produces (vite.config.ts) and renders the same
    # per-file/per-module Markdown table format used by the other two jobs, so all three jobs
    # share one reporting mechanism instead of a bespoke jq-only summary.
    - name: Publish coverage summary
      working-directory: Financial.Web
      run: |
        dotnet tool install dotnet-reportgenerator-globaltool --tool-path ../.tools
        ../.tools/reportgenerator "-reports:coverage/lcov.info" "-targetdir:CoverageReport" "-reporttypes:MarkdownSummaryGithub;JsonSummary;Html"
        cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

    # Graded, non-blocking signal: green (100%) / yellow (95-99.99%) / amber (90-94.99%) /
    # red (<90%, step fails). continue-on-error keeps a red result from failing the job, so
    # ci-status/branch protection are unaffected - see docs/ci-affected-pipeline.md. coverage/band
    # are also written as job outputs for the coverage-comment job's combined PR comment table.
    # Reads coverage/coverage-summary.json (vitest's own json-summary reporter), independent of
    # the lcov-derived CoverageReport/ above, so this gate's data source is unchanged from before.
    - name: Check coverage threshold
      id: gate
      working-directory: Financial.Web
      continue-on-error: true
      run: |
        LINE_COV=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
        if [ "$LINE_COV" = "null" ] || [ -z "$LINE_COV" ]; then
          echo "::error::Could not read total.lines.pct from coverage/coverage-summary.json"
          echo "🔴 Coverage gate: could not read line coverage from the report" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        BAND=$(awk -v v="$LINE_COV" 'BEGIN{ if (v>=100) print "green"; else if (v>=95) print "yellow"; else if (v>=90) print "amber"; else print "red" }')
        EMOJI=$(awk -v b="$BAND" 'BEGIN{ if (b=="green") print "🟢"; else if (b=="yellow") print "🟡"; else if (b=="amber") print "🟠"; else print "🔴" }')
        echo "$EMOJI Web line coverage: ${LINE_COV}% ($BAND) - gate: 90% required" >> "$GITHUB_STEP_SUMMARY"
        echo "coverage=$LINE_COV" >> "$GITHUB_OUTPUT"
        echo "band=$BAND" >> "$GITHUB_OUTPUT"
        if [ "$BAND" = "red" ]; then
          echo "::error::Web line coverage ${LINE_COV}% is below the 90% gate"
          exit 1
        elif [ "$BAND" != "green" ]; then
          echo "::warning::Web line coverage ${LINE_COV}% ($BAND)"
        fi

    - name: Upload coverage report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-web
        path: Financial.Web/CoverageReport

    - name: Build
      working-directory: Financial.Web
      run: npm run build

  # One combined sticky PR comment covering backend/wpf/web, rather than each job posting its
  # own - a skipped job (changes didn't affect it) shows as "not run this time" instead of being
  # silently absent. Each job's own detailed per-project/per-class breakdown table (generated-on
  # date, assemblies, classes, files, etc.) stays only in its GITHUB_STEP_SUMMARY (see each job's
  # "Publish coverage summary" step); this comment is intentionally just the gate verdict per
  # project plus a link to the full reports.
  coverage-comment:
    needs: [ changes, backend, wpf, web ]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Build combined coverage comment
      env:
        BACKEND_RESULT: ${{ needs.backend.result }}
        BACKEND_COVERAGE: ${{ needs.backend.outputs.coverage }}
        BACKEND_BAND: ${{ needs.backend.outputs.band }}
        WPF_RESULT: ${{ needs.wpf.result }}
        WPF_COVERAGE: ${{ needs.wpf.outputs.coverage }}
        WPF_BAND: ${{ needs.wpf.outputs.band }}
        WEB_RESULT: ${{ needs.web.result }}
        WEB_COVERAGE: ${{ needs.web.outputs.coverage }}
        WEB_BAND: ${{ needs.web.outputs.band }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        row() {
          local name="$1" result="$2" coverage="$3" band="$4" emoji
          if [ "$result" = "skipped" ]; then
            echo "| $name | – | ⚪ not run this time |"
            return
          fi
          if [ "$result" != "success" ] || [ -z "$coverage" ]; then
            echo "| $name | – | ⚠️ unavailable |"
            return
          fi
          case "$band" in
            green) emoji="🟢" ;;
            yellow) emoji="🟡" ;;
            amber) emoji="🟠" ;;
            *) emoji="🔴" ;;
          esac
          echo "| $name | ${coverage}% | $emoji $band |"
        }
        {
          echo "### Coverage summary"
          echo
          echo "| Project | Line coverage | Gate (90% required) |"
          echo "|:---|---:|:---|"
          row "Backend (.NET)" "$BACKEND_RESULT" "$BACKEND_COVERAGE" "$BACKEND_BAND"
          row "WPF (Financial.App)" "$WPF_RESULT" "$WPF_COVERAGE" "$WPF_BAND"
          row "Web (Financial.Web)" "$WEB_RESULT" "$WEB_COVERAGE" "$WEB_BAND"
          echo
          echo "[Full coverage reports (artifacts)]($RUN_URL)"
        } > coverage-comment.md

    - name: Comment coverage on PR
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: coverage-summary
        path: coverage-comment.md

  # Boots the published API with the built SPA and drives it with Playwright. Runs whenever either
  # side of the HTTP boundary changed; waits for backend/web but tolerates them being skipped.
  smoke:
    needs: [ changes, backend, web ]
    if: >-
      always()
      && needs.changes.outputs.smoke == 'true'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24.13.0

    - name: Install web dependencies
      working-directory: Financial.Web
      run: npm install

    - name: Install Playwright browser
      working-directory: Financial.Web
      run: npx playwright install --with-deps chromium

    - name: Build web frontend
      working-directory: Financial.Web
      run: |
        echo "API_BASE_URL=/api/v1/financial" > .env
        npm run build

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Publish API
      run: dotnet publish Financial.Api/Financial.Api.csproj --configuration Release --output publish

    - name: Embed web build into API wwwroot
      run: |
        mkdir -p publish/wwwroot
        cp -r Financial.Web/dist/. publish/wwwroot/

    - name: Prepare smoke test data
      run: |
        cp Tests/Financial.Api.Tests/TestData/data.test.json /tmp/data.smoke-test.json
        cp Tests/Financial.Api.Tests/TestData/data-cashflow.test.json /tmp/data-cashflow.smoke-test.json

    - name: Run browser smoke test
      env:
        Investment__Repository__Provider: LocalJson
        Investment__DataJsonFile: /tmp/data.smoke-test.json
        CashFlow__Repository__Provider: LocalJson
        CashFlow__DataJsonFile: /tmp/data-cashflow.smoke-test.json
        ASPNETCORE_URLS: http://localhost:8080
        SMOKE_APP_URL: http://localhost:8080
      run: |
        cd publish
        dotnet Financial.Api.dll &
        API_PID=$!
        cd ..
        ready=0
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8080/api/v1/financial/health > /dev/null; then
            ready=1
            break
          fi
          sleep 1
        done
        if [ "$ready" -ne 1 ]; then
          echo "API did not become healthy in time"
          kill $API_PID
          exit 1
        fi
        node Financial.Web/scripts/smoke-test.mjs
        SMOKE_EXIT=$?
        kill $API_PID
        exit $SMOKE_EXIT

  # The one status check branch protection requires. Always runs; passes when every job either
  # succeeded or was legitimately skipped by `changes`, fails otherwise.
  ci-status:
    needs: [ changes, backend, wpf, web, smoke ]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Evaluate job results
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
        if [ "${{ needs.changes.result }}" != "success" ]; then
          echo "change detection did not succeed"; exit 1
        fi
        if echo "$RESULTS" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
          echo "a job failed or was cancelled"; exit 1
        fi
        echo "all required work passed or was safely skipped"
