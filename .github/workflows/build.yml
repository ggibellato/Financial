name: Financial build

on:
  push:
    branches: [ main ]  
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
    
jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal --settings coverlet.runsettings --results-directory TestResults

    # coverlet.runsettings declares the XPlat collector itself, so --settings is enough to turn
    # collection on - no --collect argument, and so no "XPlat Code Coverage" quoting to get wrong
    # on the PowerShell-hosted Windows runner. The file is the single source of truth for what is
    # excluded (generated obj/** code).
    - name: Publish coverage summary
      run: |
        dotnet tool install dotnet-reportgenerator-globaltool --tool-path .tools
        ./.tools/reportgenerator.exe "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:CoverageReport" "-reporttypes:MarkdownSummaryGithub"
        Get-Content CoverageReport/SummaryGithub.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

  web-build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24.13.0

    - name: Install dependencies
      working-directory: Financial.Web
      run: npm install

    - name: Lint
      working-directory: Financial.Web
      run: npm run lint

    - name: Run tests
      working-directory: Financial.Web
      run: npm test

    - name: Build
      working-directory: Financial.Web
      run: npm run build

  browser-smoke-test:
    needs: [ build-and-test, web-build-test ]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24.13.0

    - name: Install web dependencies
      working-directory: Financial.Web
      run: npm install

    - name: Install Playwright browser
      working-directory: Financial.Web
      run: npx playwright install --with-deps chromium

    - name: Build web frontend
      working-directory: Financial.Web
      run: |
        echo "API_BASE_URL=/api/v1/financial" > .env
        npm run build

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish API
      run: dotnet publish Financial.Api/Financial.Api.csproj --configuration Release --output publish

    - name: Embed web build into API wwwroot
      run: |
        mkdir -p publish/wwwroot
        cp -r Financial.Web/dist/. publish/wwwroot/

    - name: Prepare smoke test data
      run: |
        cp Tests/Financial.Api.Tests/TestData/data.test.json /tmp/data.smoke-test.json
        cp Tests/Financial.Api.Tests/TestData/data-cashflow.test.json /tmp/data-cashflow.smoke-test.json

    - name: Run browser smoke test
      env:
        Investment__Repository__Provider: LocalJson
        Investment__DataJsonFile: /tmp/data.smoke-test.json
        CashFlow__Repository__Provider: LocalJson
        CashFlow__DataJsonFile: /tmp/data-cashflow.smoke-test.json
        ASPNETCORE_URLS: http://localhost:8080
        SMOKE_APP_URL: http://localhost:8080
      run: |
        cd publish
        dotnet Financial.Api.dll &
        API_PID=$!
        cd ..
        ready=0
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8080/api/v1/financial/health > /dev/null; then
            ready=1
            break
          fi
          sleep 1
        done
        if [ "$ready" -ne 1 ]; then
          echo "API did not become healthy in time"
          kill $API_PID
          exit 1
        fi
        node Financial.Web/scripts/smoke-test.mjs
        SMOKE_EXIT=$?
        kill $API_PID
        exit $SMOKE_EXIT
