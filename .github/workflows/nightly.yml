name: Financial nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Europe/London
  LANG: en-GB

jobs:
  stryker-dotnet:
    name: stryker-dotnet (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CashFlow.Domain
            project: Financial.CashFlow.Domain.csproj
            tests: Tests/Financial.CashFlow.Domain.Tests
          - name: Investment.Domain
            project: Financial.Investment.Domain.csproj
            tests: Tests/Financial.Investment.Domain.Tests
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore tools
      run: dotnet tool restore

    - name: Run Stryker.NET
      working-directory: ${{ matrix.tests }}
      run: dotnet stryker --config-file ../../.config/stryker-config.json --project ${{ matrix.project }} --output ../../TestResults/stryker/${{ matrix.name }}

    - name: Publish mutation score
      if: always()
      run: pwsh .github/scripts/mutation-score.ps1 -Report TestResults/stryker/${{ matrix.name }}/reports/mutation-report.json -Name ${{ matrix.name }}

    - name: Upload mutation report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: stryker-dotnet-${{ matrix.name }}
        path: TestResults/stryker/${{ matrix.name }}/reports
        retention-days: 14

  stryker-js:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Financial.Web
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24.13.0
        cache: npm
        cache-dependency-path: Financial.Web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Restore incremental cache
      uses: actions/cache@v4
      with:
        path: Financial.Web/reports/stryker-incremental.json
        key: stryker-js-${{ github.run_id }}
        restore-keys: stryker-js-

    - name: Run StrykerJS
      run: npm run test:mutation

    - name: Publish mutation score
      if: always()
      shell: pwsh
      working-directory: .
      run: ./.github/scripts/mutation-score.ps1 -Report Financial.Web/reports/mutation/mutation-report.json -Name Web.Logic

    - name: Upload mutation report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: stryker-js
        path: Financial.Web/reports/mutation
        retention-days: 14

  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Run full web E2E
      uses: ./.github/actions/web-e2e
      with:
        command: npm run test:e2e

    - name: Upload web E2E artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: web-e2e-artifacts
        path: |
          Financial.Web/playwright-report/
          Financial.Web/test-results/
        retention-days: 14

  e2e-wpf:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Build WPF app and E2E tests
      run: dotnet build Tests/Financial.App.E2ETests/Financial.App.E2ETests.csproj --configuration Release

    - name: Run full WPF E2E
      run: dotnet test Tests/Financial.App.E2ETests --configuration Release --no-build --verbosity normal --filter "Category=E2E"

    - name: Upload E2E artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: wpf-e2e-artifacts
        path: TestResults/e2e-artifacts
        retention-days: 14

  live:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Run live verifications
      id: live
      continue-on-error: true
      run: dotnet test Financial.slnx --configuration Release --filter "Category=Live" --logger "trx;LogFileName=live.trx" --results-directory TestResults/live

    - name: Publish live results
      if: always()
      shell: pwsh
      run: |
        $trx = Get-ChildItem TestResults/live -Filter live.trx -Recurse | Select-Object -First 1
        if (-not $trx) { throw 'no live.trx was produced' }
        ./.github/scripts/test-results-summary.ps1 -Trx $trx.FullName -Name Live
