name: Financial nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Europe/London
  LANG: en-GB

jobs:
  stryker-dotnet:
    name: stryker-dotnet (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CashFlow.Domain
            break: 72
          - name: Investment.Domain
            break: 72
          - name: CashFlow.Application
            mutate: '!**/DependencyInjection/**'
            break: 71
          - name: Investment.Application
            mutate: '!**/DependencyInjection/**'
            also-tested-by: Investment.Infrastructure
            break: 65
          - name: CashFlow.Infrastructure
            mutate: '!**/DependencyInjection/**'
            break: 87
          - name: Investment.Infrastructure
            mutate: '!**/DependencyInjection/**'
            break: 87
          - name: Shared.Abstractions
            break: 81
          - name: Shared.Infrastructure
            mutate: '!**/DependencyInjection/**'
            break: 78
          - name: Api
            break: 89
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.403

    - name: Restore tools
      run: dotnet tool restore

    - name: Run Stryker.NET
      shell: pwsh
      working-directory: Financial.${{ matrix.name }}
      env:
        NAME: ${{ matrix.name }}
        ALSO_TESTED_BY: ${{ matrix.also-tested-by }}
        MUTATE: ${{ matrix.mutate }}
        BREAK_AT: ${{ matrix.break }}
      run: |
        $thresholds = (Get-Content ../.config/stryker-config.json -Raw | ConvertFrom-Json).'stryker-config'.thresholds
        $low = [math]::Max($thresholds.low, [int]$env:BREAK_AT)
        $high = [math]::Max($thresholds.high, $low)
        $arguments = @('stryker', '--config-file', '../.config/stryker-config.json', '--output', "../TestResults/stryker/$env:NAME", '--break-at', $env:BREAK_AT, '--threshold-low', $low, '--threshold-high', $high)
        foreach ($testTarget in @($env:NAME, $env:ALSO_TESTED_BY) | Where-Object { $_ }) {
          $arguments += @('--test-project', "../Tests/Financial.$testTarget.Tests/Financial.$testTarget.Tests.csproj")
        }
        if ($env:MUTATE) { $arguments += @('--mutate', $env:MUTATE) }
        & dotnet @arguments
        exit $LASTEXITCODE

    - name: Publish mutation score
      if: always()
      run: pwsh .github/scripts/mutation-score.ps1 -Report TestResults/stryker/${{ matrix.name }}/reports/mutation-report.json -Name ${{ matrix.name }}

    - name: Upload mutation report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: stryker-dotnet-${{ matrix.name }}
        path: TestResults/stryker/${{ matrix.name }}/reports
        retention-days: 14

  stryker-js:
    name: stryker-js (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Web.Logic
            config: stryker.config.json
            reports: mutation
            incremental: stryker-incremental.json
          - name: Web.Components
            config: stryker.components.config.json
            reports: mutation-components
            incremental: stryker-components-incremental.json
    defaults:
      run:
        working-directory: Financial.Web
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24.13.0
        cache: npm
        cache-dependency-path: Financial.Web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Restore incremental cache
      uses: actions/cache@v4
      with:
        path: Financial.Web/reports/${{ matrix.incremental }}
        key: stryker-js-${{ matrix.name }}-${{ github.run_id }}
        restore-keys: stryker-js-${{ matrix.name }}-

    - name: Run StrykerJS
      run: npm run test:mutation -- ${{ matrix.config }}

    - name: Publish mutation score
      if: always()
      shell: pwsh
      working-directory: .
      run: ./.github/scripts/mutation-score.ps1 -Report Financial.Web/reports/${{ matrix.reports }}/mutation-report.json -Name ${{ matrix.name }}

    - name: Upload mutation report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: stryker-js-${{ matrix.name }}
        path: Financial.Web/reports/${{ matrix.reports }}
        retention-days: 14

  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Run full web E2E
      uses: ./.github/actions/web-e2e
      with:
        command: npm run test:e2e

    - name: Upload web E2E artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: web-e2e-artifacts
        path: |
          Financial.Web/playwright-report/
          Financial.Web/test-results/
        retention-days: 14

  live:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.403

    - name: Run live verifications
      continue-on-error: true
      run: dotnet test Financial.slnx --configuration Release --filter "Category=Live" --logger "trx;LogFilePrefix=live" --results-directory TestResults/live

    - name: Publish live results
      shell: pwsh
      run: |
        ./.github/scripts/test-results-summary.ps1 -Trx 'TestResults/live/*.trx' -Name Live

  ac-traceability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Report untraced acceptance criteria
      shell: pwsh
      run: ./.github/scripts/ac-traceability.ps1

  report:
    needs: [ stryker-dotnet, stryker-js, e2e-web, ac-traceability ]
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Open or update the failure issue
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        NEEDS: ${{ toJSON(needs) }}
      run: ./.github/scripts/nightly-issue.ps1 -NeedsJson $env:NEEDS -RunUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
