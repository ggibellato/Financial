name: Web E2E
description: Builds the SPA and the API, seeds test data, starts the published app, waits for its health endpoint and runs a Playwright npm command against it. The caller checks out the repository first and uploads the Playwright artifacts.
inputs:
  command:
    description: Command run in Financial.Web against the started app (for example "npm run smoke-test" or "npm run test:e2e")
    required: true
runs:
  using: composite
  steps:
  - name: Setup Node
    uses: actions/setup-node@v6
    with:
      node-version: 24.13.0

  - name: Install web dependencies
    shell: bash
    working-directory: Financial.Web
    run: npm install

  - name: Install Playwright browser
    shell: bash
    working-directory: Financial.Web
    run: npx playwright install --with-deps chromium

  - name: Build web frontend
    shell: bash
    working-directory: Financial.Web
    run: |
      echo "API_BASE_URL=/api/v1/financial" > .env
      npm run build

  - name: Setup .NET
    uses: actions/setup-dotnet@v6
    with:
      dotnet-version: 10.0.x

  - name: Publish API
    shell: bash
    run: dotnet publish Financial.Api/Financial.Api.csproj --configuration Release --output publish

  - name: Embed web build into API wwwroot
    shell: bash
    run: |
      mkdir -p publish/wwwroot
      cp -r Financial.Web/dist/. publish/wwwroot/

  - name: Prepare web E2E test data
    shell: bash
    run: |
      cp Tests/Financial.Api.Tests/TestData/data.test.json /tmp/data.web-e2e.json
      cp Tests/Financial.Api.Tests/TestData/data-cashflow.test.json /tmp/data-cashflow.web-e2e.json

  - name: Run web E2E
    shell: bash
    env:
      Investment__Repository__Provider: LocalJson
      Investment__DataJsonFile: /tmp/data.web-e2e.json
      CashFlow__Repository__Provider: LocalJson
      CashFlow__DataJsonFile: /tmp/data-cashflow.web-e2e.json
      ASPNETCORE_URLS: http://localhost:8080
      SMOKE_APP_URL: http://localhost:8080
      E2E_COMMAND: ${{ inputs.command }}
    run: |
      (cd publish && exec dotnet Financial.Api.dll) &
      API_PID=$!
      trap 'kill $API_PID' EXIT
      ready=0
      for i in $(seq 1 30); do
        if curl -sf http://localhost:8080/api/v1/financial/health > /dev/null; then
          ready=1
          break
        fi
        sleep 1
      done
      if [ "$ready" -ne 1 ]; then
        echo "API did not become healthy in time"
        exit 1
      fi
      cd Financial.Web
      bash -c "$E2E_COMMAND"
