name: Coverage gate
description: Fails below the 90% line-coverage tripwire and exposes line and branch coverage with a traffic-light emoji each, from a reportgenerator Summary.json.
inputs:
  label:
    description: Human-readable project label for step-summary/error messages (e.g. "Backend", "WPF")
    required: true
  summary-path:
    description: Path to reportgenerator's Summary.json
    required: false
    default: CoverageReport/Summary.json
outputs:
  coverage:
    description: Line coverage percentage, rounded to 2 decimals
    value: ${{ steps.gate.outputs.coverage }}
  emoji:
    description: Traffic-light emoji for the line coverage (green 100, yellow 95, amber 90, red below)
    value: ${{ steps.gate.outputs.emoji }}
  branch:
    description: Branch coverage percentage, rounded to 2 decimals (empty when the report has none)
    value: ${{ steps.gate.outputs.branch }}
  branch-emoji:
    description: Traffic-light emoji for the branch coverage (same bands as the line emoji)
    value: ${{ steps.gate.outputs.branch-emoji }}
runs:
  using: composite
  steps:
    - id: gate
      shell: pwsh
      run: |
        $summary = Get-Content '${{ inputs.summary-path }}' -Raw | ConvertFrom-Json
        $lineCoverage = $summary.summary.linecoverage
        if ($null -eq $lineCoverage) {
          Write-Host "::error::Could not read summary.linecoverage from ${{ inputs.summary-path }}"
          "🔴 Coverage gate: could not read line coverage from the report" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit 1
        }
        $lineCoverage = [math]::Round([double]$lineCoverage, 2)
        if ($lineCoverage -ge 100) { $band = 'green'; $emoji = '🟢' }
        elseif ($lineCoverage -ge 95) { $band = 'yellow'; $emoji = '🟡' }
        elseif ($lineCoverage -ge 90) { $band = 'amber'; $emoji = '🟠' }
        else { $band = 'red'; $emoji = '🔴' }
        $branchCoverage = $summary.summary.branchcoverage
        $branch = ''
        $branchEmoji = '⚪'
        if ($null -ne $branchCoverage) {
          $branchCoverage = [math]::Round([double]$branchCoverage, 2)
          $branch = "$branchCoverage"
          if ($branchCoverage -ge 100) { $branchEmoji = '🟢' }
          elseif ($branchCoverage -ge 95) { $branchEmoji = '🟡' }
          elseif ($branchCoverage -ge 90) { $branchEmoji = '🟠' }
          else { $branchEmoji = '🔴' }
        }
        $branchText = if ($branch) { "$branch%" } else { 'n/a' }
        "$emoji ${{ inputs.label }} line coverage: $lineCoverage%, $branchEmoji branch coverage: $branchText" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
        "coverage=$lineCoverage" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
        "emoji=$emoji" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
        "branch=$branch" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
        "branch-emoji=$branchEmoji" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
        if ($band -eq 'red') {
          Write-Host "::error::${{ inputs.label }} line coverage $lineCoverage% is below the 90% gate"
          exit 1
        } elseif ($band -ne 'green') {
          Write-Host "::warning::${{ inputs.label }} line coverage $lineCoverage% ($band)"
        }
