name: Coverage gate
description: Fails below the 90% line-coverage tripwire or when line or branch coverage drops more than 0.5 points below coverage-baseline.json, and exposes line and branch coverage with a traffic-light emoji and the delta against the baseline, from a reportgenerator Summary.json.
inputs:
  label:
    description: Human-readable project label for step-summary/error messages (e.g. "Backend", "WPF")
    required: true
  summary-path:
    description: Path to reportgenerator's Summary.json
    required: false
    default: CoverageReport/Summary.json
  baseline-key:
    description: Entry of coverage-baseline.json this job is held to (backend, wpf or web)
    required: true
  baseline-path:
    description: Path to the committed baseline file
    required: false
    default: coverage-baseline.json
outputs:
  coverage:
    description: Line coverage percentage, rounded to 2 decimals
    value: ${{ steps.gate.outputs.coverage }}
  emoji:
    description: Traffic-light emoji for the line coverage (green 90 and up, yellow 85, amber 80, red below)
    value: ${{ steps.gate.outputs.emoji }}
  branch:
    description: Branch coverage percentage, rounded to 2 decimals (empty when the report has none)
    value: ${{ steps.gate.outputs.branch }}
  branch-emoji:
    description: Traffic-light emoji for the branch coverage (same bands as the line emoji)
    value: ${{ steps.gate.outputs.branch-emoji }}
  line-delta:
    description: Signed line coverage change against the baseline, 2 decimals (empty when the baseline could not be read)
    value: ${{ steps.gate.outputs.line-delta }}
  branch-delta:
    description: Signed branch coverage change against the baseline, 2 decimals (empty when the baseline or the branch figure is missing)
    value: ${{ steps.gate.outputs.branch-delta }}
runs:
  using: composite
  steps:
    - id: gate
      shell: pwsh
      run: |
        & "${{ github.action_path }}/../../scripts/coverage-gate.ps1" `
          -Label '${{ inputs.label }}' `
          -SummaryPath '${{ inputs.summary-path }}' `
          -BaselineKey '${{ inputs.baseline-key }}' `
          -BaselinePath '${{ inputs.baseline-path }}'
        exit $LASTEXITCODE
